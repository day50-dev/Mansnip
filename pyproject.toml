[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mansnip"
version = "0.6.6"
description = "Finding just the snippets in man page you and your model care about"
readme = "README.md"
requires-python = ">=3.2"
license = "MIT"
authors = [
    {name = "Chris McKenzie", email = "kristopolous@yahoo.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["mcp"]

[project.urls]
Homepage = "https://github.com/day50-dev/llm-manpage-tool.git"

[tool.setuptools]
script-files = ["mansnip"]
